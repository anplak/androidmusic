build:
  # Allow existing and future issues up to a high threshold while we incrementally fix them.
  maxIssues: 1000

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120

comments:
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false

naming:
  TopLevelPropertyNaming:
    active: true
  FunctionNaming:
    # Disable function naming checks (allows @Composable upper-case names)
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'java.lang.Exception'
      - 'java.lang.RuntimeException'

performance:
  SpreadOperator:
    active: true

# potential-bugs rules are handled by compiler for many cases; keep this section minimal
potential-bugs:
  active: true
